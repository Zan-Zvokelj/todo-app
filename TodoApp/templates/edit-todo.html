{% extends 'layout.html' %}

{% block content %}
<div class="container d-flex justify-content-center">
  <div class="card w-100" style="max-width: 500px;">
    <div class="card-header text-center">
      Edit Todo
    </div>
    <div class="card-body">
      <form id="editTodoForm">

        <div class="form-group">
          <label>Title</label>
          <input class="form-control" name="title" value="{{ todo.title }}">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea class="form-control" name="description">{{ todo.description }}</textarea>
        </div>

        <div class="form-group">
          <label>Priority</label>
          <select class="form-control" name="priority">
            {% for i in range(1,6) %}
              <option {% if todo.priority == i %}selected{% endif %}>{{ i }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="complete"
            {% if todo.complete %}checked{% endif %}>
          <label class="form-check-label">Complete</label>
        </div>

        <button class="btn btn-primary">Save</button>
        <a href="/todos/todo-page" class="btn btn-secondary">Back</a>

      </form>
    </div>
  </div>
</div>
{% endblock %}
